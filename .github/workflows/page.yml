name: Page CRHB Week-end

on:
  schedule:
    - cron: "43 7,20 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: page
  cancel-in-progress: true

jobs:
  page:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    env:
      TZ: Europe/Paris
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installation
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Lecture FFHB, visuels et affiches
        run: python generer_page.py
      - name: Assemblage de la page
        run: |
          mkdir -p site
          cp page/index.html site/index.html
          cp charte/logo.png site/logo.png
          cp -r page_en_ligne/* site/
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploiement
        uses: actions/deploy-pages@v4
