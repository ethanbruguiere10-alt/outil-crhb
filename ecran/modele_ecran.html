<!doctype html><html><head><meta charset="utf-8">
<!-- Vidéo « PROCHAIN MATCH » pour l'écran géant (1920 × 1080, 10 s en boucle).
     L'animation est pilotée image par image par ffhb_resultats.py : window.frame(t) avec t en secondes. -->
<style>
@font-face{font-family:Anton;src:url(__ANTON__)}
@font-face{font-family:Colo;src:url(__COLO__)}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1920px;height:1080px;background:#fddc1d;overflow:hidden}
#e{position:relative;width:1920px;height:1080px;overflow:hidden;background:#fddc1d}
#fond{position:absolute;left:-60px;top:-34px;width:2040px;height:1148px;background:url(__FOND__) center/cover;will-change:transform}
.abs{position:absolute;will-change:transform,opacity}
/* titre */
#titre{left:0;right:0;top:72px;text-align:center;font-family:Anton;font-size:208px;line-height:1;letter-spacing:3px;
 background:linear-gradient(100deg,#061d4e 0%,#0d3a7e 30%,#1c5ea8 50%,#0d3a7e 70%,#061d4e 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 6px 0 rgba(6,29,78,.12))}
#brille{left:0;right:0;top:72px;text-align:center;font-family:Anton;font-size:208px;line-height:1;letter-spacing:3px;color:transparent;
 background:linear-gradient(100deg,transparent 0%,transparent 42%,rgba(255,255,255,.75) 50%,transparent 58%,transparent 100%);background-size:300% 100%;
 -webkit-background-clip:text;background-clip:text}
/* fanion compétition */
#fanion{right:50px;top:0;width:170px;height:268px;background:#fff;clip-path:polygon(0 0,100% 0,100% 100%,50% 86%,0 100%);
 display:flex;flex-direction:column;align-items:center;padding-top:18px;box-shadow:0 0 0 rgba(0,0,0,0)}
#fanion img{width:104px;height:auto}
#fanion b{font-family:Anton;font-weight:400;font-size:46px;line-height:1;margin-top:4px;color:#1c3f8f;letter-spacing:1px}
#fanion i{display:block;width:116px;height:3px;background:#1c3f8f;margin:6px 0 7px}
#fanion small{font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:17px;line-height:1.1;text-align:center;color:#1c3f8f;letter-spacing:.3px}
#fanion.rose b,#fanion.rose small{color:#1c3f8f}#fanion.rose i{background:#b3236e}
/* logos */
.logo{width:460px;height:460px;display:flex;align-items:center;justify-content:center}
.logo img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 18px 24px rgba(80,60,0,.25))}
.logo .sans{width:400px;height:400px;border-radius:50%;background:#061d4e;color:#fddc1d;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Anton;font-size:64px;line-height:1.05;padding:40px}
#ld{left:255px;top:375px}#le{left:1205px;top:375px}
#vs{left:0;right:0;top:500px;text-align:center;font-family:Colo;font-size:230px;line-height:1;text-transform:uppercase;
 background:linear-gradient(180deg,#1c5ea8,#061d4e);-webkit-background-clip:text;background-clip:text;color:transparent}
.ligne{left:0;right:0;text-align:center;font-family:Colo;text-transform:uppercase;line-height:1;letter-spacing:2px;
 background:linear-gradient(90deg,#061d4e 0%,#0d3a7e 45%,#1c5ea8 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
#l1{top:850px;font-size:104px}#l2{top:962px;font-size:96px}
</style></head><body><div id="e">
 <div id="fond"></div>
 <div class="abs" id="titre">PROCHAIN MATCH</div>
 <div class="abs" id="brille">PROCHAIN MATCH</div>
 <div class="abs" id="fanion"><img id="ballon"><b id="code"></b><i></i><small>CHAMPIONNAT<br>DE FRANCE</small></div>
 <div class="abs logo" id="ld"></div>
 <div class="abs" id="vs">VS</div>
 <div class="abs logo" id="le"></div>
 <div class="abs ligne" id="l1"></div>
 <div class="abs ligne" id="l2"></div>
</div><script>

// logos à surface égale : un écusson haut et un logo large paraissent de la même taille
function egalise(sel,A,maxW,maxH){return Promise.all([...document.querySelectorAll(sel)].map(im=>new Promise(ok=>{
 const go=()=>{const a=(im.naturalWidth||1)/(im.naturalHeight||1);let h=Math.sqrt(A/a),w=h*a;const k=Math.min(1,maxW/w,maxH/h);
  im.style.width=(w*k)+"px";im.style.height=(h*k)+"px";im.style.maxWidth="none";im.style.maxHeight="none";im.style.objectFit="fill";ok()};
 if(im.complete&&im.naturalWidth)go();else{im.addEventListener("load",go);im.addEventListener("error",()=>ok())}})))}
const D=__DATA__;
const $=i=>document.getElementById(i);
const logo=(src,nom)=>src?`<img src="${src}" alt="">`:`<div class="sans">${nom}</div>`;
$("ld").innerHTML=logo(D.logo_dom,D.nom_dom); $("le").innerHTML=logo(D.logo_ext,D.nom_ext);
$("ballon").src=D.ballon; $("code").textContent=D.code; if(D.rose)$("fanion").classList.add("rose");
$("l1").textContent=`${D.heure} / ${D.date}`; $("l2").textContent=D.salle;
// ---- outils d'animation ----
const cl=v=>v<0?0:v>1?1:v, p=(t,a,b)=>cl((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3), eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const back=x=>{const c=1.70158,c3=c+1;return 1+c3*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const st=(id,o,tr)=>{const e=$(id);e.style.opacity=o;e.style.transform=tr};
const DUREE=D.duree||10, SORTIE=DUREE-.75;
window.frame=function(t){
 const w=2*Math.PI*t/DUREE;                       // mouvement périodique : boucle parfaite
 $("fond").style.transform=`translate(${Math.sin(w)*26}px,${Math.cos(w)*14}px) scale(${1.02+.015*Math.sin(w)})`;
 const out=eio(p(t,SORTIE,DUREE));                // sortie de tous les éléments
 const O=x=>x*(1-out);
 // titre : tombe du haut avec rebond
 const a=back(p(t,.15,.85));
 st("titre",O(cl(p(t,.15,.45))),`translateY(${(1-a)*-260}px) scale(${1+out*.06})`);
 // reflet qui balaie le titre (deux passages)
 const s1=p(t,1.2,2.2), s2=p(t,5.6,6.6), s=s1>0&&s1<1?s1:s2;
 $("brille").style.opacity=O(s>0&&s<1?1:0); $("brille").style.backgroundPosition=`${100-s*100}% 0`;
 $("brille").style.transform=$("titre").style.transform;
 // fanion : descend
 const f=eo(p(t,.55,1.1));
 st("fanion",O(1),`translateY(${(1-f)*-290}px)`);
 // logos : arrivent des côtés puis respirent
 const g=back(p(t,.85,1.55)), r=back(p(t,1.0,1.7)), b=Math.sin(2*Math.PI*(t-2)/4)*.018;
 st("ld",O(cl(p(t,.85,1.15))),`translateX(${(1-g)*-760}px) rotate(${(1-g)*-12}deg) scale(${(1+(t>1.7?b:0))*(1-out*.25)})`);
 st("le",O(cl(p(t,1.0,1.3))),`translateX(${(1-r)*760}px) rotate(${(1-r)*12}deg) scale(${(1-(t>1.7?b:0))*(1-out*.25)})`);
 // VS : apparition « tampon »
 const v=p(t,1.55,1.95), vs=v<1?2.4-1.4*back(v):1+.03*Math.sin(2*Math.PI*(t-2)/2);
 st("vs",O(cl(v*2)),`scale(${vs*(1-out*.3)})`);
 // heure / date puis salle : montent
 const d1=eo(p(t,2.0,2.5)), d2=eo(p(t,2.25,2.75));
 st("l1",O(d1),`translateY(${(1-d1)*60}px)`);
 st("l2",O(d2),`translateY(${(1-d2)*60}px)`);
};
window.frame(0);
Promise.all([egalise(".logo img",400*400,460,460),document.fonts.ready,...[...document.images].map(i=>i.complete?1:new Promise(ok=>{i.onload=i.onerror=ok}))])
 .then(()=>setTimeout(()=>document.body.dataset.pret="1",100));
</script></body></html>
